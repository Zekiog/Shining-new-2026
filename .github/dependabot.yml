# Dependabot updates only where a manifest exists.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
  open-pull-requests-limit: 5
  groups:
    actions-minor:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: ci
  labels:
  - dependencies
  - automated
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: tuesday
    time: 06:00
  open-pull-requests-limit: 5
  groups:
    npm-minor:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore
  labels:
  - dependencies
  - automated
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
